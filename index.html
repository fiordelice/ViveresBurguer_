<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>𝑽í𝒗𝒆𝒓𝒆𝒔 𝑩𝒖𝒓𝒈𝒖𝒆𝒓</title>
<style>
:root {
  --orange:#ff6600; --black:#111; --dark:#222; --white:#fff; --red:#ff3b3b;
}
body {
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--black);
  color:var(--white);
}
header {
  background:var(--black);
  border-bottom:2px solid var(--orange);
  padding:16px;
}
.header-content {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
}
header .logo {
  width:48px;
  height:48px;
  object-fit:contain;
  border-radius:8px;
}
header .site-name {
  font-size:1.8rem;
  font-weight:700;
  color:var(--orange);
}

/* Container e layout */
.container{
  max-width:1200px;
  margin:24px auto;
  padding:0 16px;
  display:grid;
  grid-template-columns:1fr 360px;
  gap:24px;
}
.menu{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:18px;
}

/* Cards */
.card{
  background:var(--dark);
  border-radius:14px;
  padding:12px;
  display:flex;
  flex-direction:column;
  gap:10px;
  box-shadow:0 6px 20px rgba(0,0,0,0.2);
  position:relative;
  transition:0.3s;
}
.card:hover{
  transform:translateY(-3px);
  box-shadow:0 12px 30px rgba(0,0,0,0.4);
}
.thumb{
  width:100%;
  aspect-ratio:4/3;
  border-radius:10px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#333;
}
.thumb img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.badge{
  position:absolute;
  top:8px;
  left:8px;
  background:var(--orange);
  color:#fff;
  font-size:0.75rem;
  padding:4px 8px;
  border-radius:8px;
}

.name{font-weight:700;color:var(--orange);}
.price{font-weight:800;color:var(--orange);}
.desc{font-size:0.92rem;color:#ccc;margin-top:6px;}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;}
.btn{
  background:var(--orange);
  color:#fff;
  border:none;
  padding:10px 12px;
  border-radius:10px;
  cursor:pointer;
  font-weight:700;
  transition:0.12s;
}
.btn:active{transform:translateY(1px);}
.btn.remove{background:var(--red);}

/* Carrinho */
.cart{
  position:relative;
  background:var(--black);
  border-radius:14px;
  padding:16px;
  box-shadow:0 6px 20px rgba(0,0,0,0.2);
  min-height:220px;
}
.cart h3{margin:0 0 6px 0;color:var(--orange);}
.cart-empty{color:#ccc;padding:18px;background:var(--dark);border-radius:10px;text-align:center;}
.cart-list{display:flex;flex-direction:column;gap:12px;max-height:420px;overflow:auto;}
.cart-item{display:flex;gap:12px;align-items:center;padding:8px;border-radius:10px;background:#333;}
.ci-thumb{width:64px;height:64px;border-radius:8px;overflow:hidden;flex-shrink:0;}
.ci-thumb img{width:100%;height:100%;object-fit:cover;}
.ci-meta{flex:1;}
.ci-meta .ci-name{font-weight:700;}
.ci-meta .ci-desc{font-size:0.9rem;color:#ccc;}
.ci-controls{display:flex;flex-direction:column;align-items:flex-end;gap:6px;}
.qty{display:inline-flex;align-items:center;border-radius:10px;overflow:hidden;border:1px solid rgba(255,255,255,0.2);}
.qty button{background:transparent;border:0;padding:8px 10px;cursor:pointer;font-weight:700;color:#fff;}
.qty span{display:inline-block;padding:8px 10px;min-width:28px;text-align:center;color:#fff;}
.ci-price{font-weight:800;color:var(--orange);}
.totals{margin-top:14px;border-top:1px dashed rgba(255,255,255,0.2);padding-top:12px;display:flex;flex-direction:column;gap:10px;}
.totals .row{display:flex;justify-content:space-between;align-items:center;}
.checkout{margin-top:8px;display:flex;gap:10px;}
.checkout .btn{flex:1;}

/* Modal */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,0.8);z-index:80;}
.modal.open{display:flex;}
.modal-card{width:80%;max-width:540px;background:var(--dark);border-radius:14px;padding:18px;box-shadow:0 30px 60px rgba(0,0,0,0.25);}
.order-list{max-height:260px;overflow:auto;margin-top:10px;display:flex;flex-direction:column;gap:8px;}
.order-item{display:flex;align-items:center;gap:8px;}
.order-item img{width:48px;height:48px;object-fit:cover;border-radius:6px;}

/* Inputs */
select,input{width:100%;padding:10px;border-radius:8px;margin-top:6px;background:#333;border:1px solid #555;color:#fff;}
#delivery-address-container input { width: 80%; max-width: 200px; padding: 8px 10px; border-radius: 8px; border: 1px solid #555; background: #222; color: #fff; margin-bottom: 6px; text-align: left; box-sizing: border-box; }

/* Responsividade */
@media(max-width:980px){.container{grid-template-columns:1fr 340px;}}
@media(max-width:760px){.container{grid-template-columns:1fr;}.cart{order:2;margin-top:18px;}}

/* Botão WhatsApp flutuante */
#whatsapp-btn{
  position:fixed;
  bottom:20px;
  right:20px;
  background:var(--green,#25d366);
  color:#fff;
  border:none;
  border-radius:50%;
  width:60px;
  height:60px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:1.5rem;
  cursor:pointer;
  box-shadow:0 6px 20px rgba(0,0,0,0.3);
  z-index:90;
}

  #footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: var(--dark);
  color: var(--orange);
  text-align: center;
  padding: 12px 0;
  font-weight: 700;
  font-size: 1rem; /* base do texto */
  box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
  z-index: 100;
}

/* Ajustes responsivos para telas menores */
@media(max-width: 600px){
  #footer {
    font-size: 0.9rem;
    padding: 10px 0;
  }
}

body {
  margin-bottom: 50px; /* espaço para não sobrepor o footer */
}

</style>
</head>
<body>

<header>
  <div class="header-content">
    <img src="logo.png" alt="Logo Viveres Burger" class="logo">
    <span class="site-name">𝑽í𝒗𝒆𝒓𝒆𝒔 𝑩𝒖𝒓𝒈𝒖𝒆𝒓</span>
  </div>
</header>

<main class="container">
  <section>
    <h2>Nosso Cardápio</h2>
    <div class="menu" id="menu"></div>
  </section>
  <aside class="cart">
    <h3>Seu Carrinho</h3>
    <div id="cart-empty" class="cart-empty">Carrinho vazio</div>
    <div class="cart-list" id="cart-list" style="display:none"></div>
    <div class="totals" id="cart-totals" style="display:none">
      <div class="row"><div>Total</div><div id="total">R$ 0,00</div></div>
      <div style="margin-top:6px"><label for="payment">Forma de pagamento:</label>
        <select id="payment">
          <option value="Dinheiro">Dinheiro</option>
          <option value="Pix">Pix</option>
          <option value="Cartão">Cartão</option>
        </select>
      </div>
      <div class="checkout">
        <button class="btn" id="btn-checkout">Finalizar Pedido</button>
        <button class="btn remove" id="btn-clear">Limpar</button>
      </div>
    </div>
  </aside>
</main>

<!-- Modal resumo -->
<div class="modal" id="modal">
  <div class="modal-card">
    <h2>Resumo do Pedido</h2>
    <div class="order-list" id="order-list"></div>
    <div style="margin-top:12px">
      <div class="row" style="display:flex;justify-content:space-between;font-weight:800;font-size:1.1rem">
        <div>Total</div><div id="modal-total">R$ 0,00</div>
      </div>
      <div style="margin-top:12px;display:flex;gap:8px;flex-direction:column">
        <label for="delivery-option">Retirada ou Delivery:</label>
        <select id="delivery-option">
          <option value="Retirar">Retirar no local</option>
          <option value="Delivery">Delivery (+R$5,00)</option>
        </select>
        <div id="card-type-container" style="display:none">
          <label for="card-type">Se cartão, escolha:</label>
          <select id="card-type">
            <option value="Débito">Débito</option>
            <option value="Crédito">Crédito</option>
          </select>
        </div>
        <div id="delivery-address-container" style="display:none">
          <label for="delivery-address">Endereço para entrega:</label>
          <input type="text" id="delivery-address-bairro" placeholder="Bairro">
          <input type="text" id="delivery-address-rua" placeholder="Rua">
          <input type="text" id="delivery-address-num" placeholder="Número">
        </div>
        <button class="btn" id="confirm-order">Confirmar Pedido</button>
      </div>
    </div>
  </div>
</div>
<footer id="footer">
     Víveres 2025 - Desenvolvido por Gabriella Fiordelice
</footer>

<!-- Botão WhatsApp flutuante -->
<button id="whatsapp-btn">💬</button>

<script>
// estado da loja
function verificarHorarioFuncionamento() {
    const agora = new Date();
    const utc = agora.getTime() + (agora.getTimezoneOffset() * 60000);
    const brasilia = new Date(utc + (3600000 * -3)); 
    const diaSemana = brasilia.getDay(); 
    const hora = brasilia.getHours();
    const minuto = brasilia.getMinutes();
    const aberto = (diaSemana >= 1 && diaSemana <= 6) &&
                   ((hora > 18 || (hora === 18 && minuto >= 30)) &&
                    (hora < 22 || (hora === 22 && minuto <= 20)));
    return { aberto, diaSemana };
}

let statusLoja = verificarHorarioFuncionamento();
let lojaAberta = statusLoja.aberto;
setInterval(()=>{ statusLoja = verificarHorarioFuncionamento(); lojaAberta = statusLoja.aberto; },60000);

// menu
const menuItems=[
  {id:1,name:'Classic Burger',desc:'Hambúrguer simples',price:28.50,img:'burguer.png',badge:'Mais pedido'},
  {id:2,name:'Bacon Bliss',desc:'Bacon + queijo',price:36.90,img:'burguer1.png',badge:'Novo'},
  {id:3,name:'Cheese Lover',desc:'Queijo extra',price:32.00,img:'burguer2.png',badge:''},
  {id:4,name:'Veggie Delight',desc:'Veggie burger',price:30.00,img:'burguer3.png',badge:'Vegano'}
];

const menuEl=document.getElementById('menu');
menuItems.forEach(i=>{
  const card=document.createElement('div'); card.className='card';
  card.innerHTML=`
    <div class="thumb">${i.img ? `<img src="${i.img}">` : '<span style="color:#ccc">Sem imagem</span>'}</div>
    ${i.badge ? `<div class="badge">${i.badge}</div>` : ''}
    <div class="name">${i.name}</div>
    <div class="price">R$ ${i.price.toFixed(2)}</div>
    <div class="desc">${i.desc}</div>
    <div class="row"><button class="btn" data-id="${i.id}">Adicionar</button></div>
  `;
  menuEl.appendChild(card);
});

// carrinho
let cart=[];
const cartEmpty=document.getElementById('cart-empty');
const cartList=document.getElementById('cart-list');
const cartTotals=document.getElementById('cart-totals');
const totalEl=document.getElementById('total');

function updateCart(){
  if(cart.length===0){
    cartEmpty.style.display='block';
    cartList.style.display='none';
    cartTotals.style.display='none';
    return;
  }
  cartEmpty.style.display='none';
  cartList.style.display='flex';
  cartTotals.style.display='flex';
  cartList.innerHTML='';
  let total=0;
  cart.forEach((item,idx)=>{
    total+=item.price*item.qty;
    const div=document.createElement('div'); div.className='cart-item';
    div.innerHTML=`
      <div class="ci-thumb">${item.img ? `<img src="${item.img}">` : '<span style="color:#ccc">Sem imagem</span>'}</div>
      <div class="ci-meta"><div class="ci-name">${item.name}</div><div class="ci-desc">R$ ${item.price.toFixed(2)}</div></div>
      <div class="ci-controls">
        <div class="qty"><button class="minus">-</button><span>${item.qty}</span><button class="plus">+</button></div>
        <button class="btn remove">Remover</button>
      </div>
    `;
    div.querySelector('.minus').addEventListener('click',()=>{ if(item.qty>1){item.qty--; updateCart(); }});
    div.querySelector('.plus').addEventListener('click',()=>{ item.qty++; updateCart(); });
    div.querySelector('.remove').addEventListener('click',()=>{ cart.splice(idx,1); updateCart(); });
    cartList.appendChild(div);
  });
  totalEl.textContent='R$ '+total.toFixed(2);
}

// adicionar item
document.querySelectorAll('.card .btn').forEach(b=>{
  b.addEventListener('click',e=>{
    if(!lojaAberta){ alert('A loja está fechada. Funciona Seg-Sáb 18:30–22:20'); return; }
    const id=parseInt(e.currentTarget.dataset.id);
    const item=menuItems.find(i=>i.id===id);
    const existing=cart.find(c=>c.id===id);
    if(existing){existing.qty++;}else{cart.push({...item, qty:1});}
    updateCart();
  });
});

// limpar carrinho
document.getElementById('btn-clear').addEventListener('click',()=>{ cart=[]; updateCart(); });

// checkout modal
const modal=document.getElementById('modal');
const orderList=document.getElementById('order-list');
const modalTotal=document.getElementById('modal-total');
const paymentEl=document.getElementById('payment');
const cardTypeEl=document.getElementById('card-type');
const cardTypeContainer=document.getElementById('card-type-container');
const deliveryEl=document.getElementById('delivery-option');
const deliveryAddressContainer=document.getElementById('delivery-address-container');
const deliveryBairro=document.getElementById('delivery-address-bairro');
const deliveryRua=document.getElementById('delivery-address-rua');
const deliveryNum=document.getElementById('delivery-address-num');

paymentEl.addEventListener('change',()=>{ cardTypeContainer.style.display = paymentEl.value==='Cartão'?'block':'none'; });
deliveryEl.addEventListener('change',()=>{ deliveryAddressContainer.style.display = deliveryEl.value==='Delivery'?'block':'none'; });

document.getElementById('btn-checkout').addEventListener('click',()=>{
  if(cart.length===0){alert('Carrinho vazio'); return;}
  orderList.innerHTML='';
  let total=0;
  cart.forEach(i=>{
    total+=i.price*i.qty;
    const div=document.createElement('div'); div.className='order-item';
    div.innerHTML = `${i.img ? `<img src="${i.img}">` : ''} ${i.name} x${i.qty} — R$ ${(i.price*i.qty).toFixed(2)}`;
    orderList.appendChild(div);
  });
  modalTotal.textContent='R$ '+total.toFixed(2);
  modal.classList.add('open');
});

// confirmar pedido -> WhatsApp
document.getElementById('confirm-order').addEventListener('click',()=>{
  if(cart.length===0){ alert('Carrinho vazio'); return; }
  let total=parseFloat(cart.reduce((a,c)=>a+c.price*c.qty,0).toFixed(2));
  const payment=paymentEl.value;
  const cardType=payment==='Cartão'?cardTypeEl.value:'';
  const deliveryOption=deliveryEl.value;
  let deliveryAddress='';
  if(deliveryOption==='Delivery'){
    total+=5;
    deliveryAddress=`Bairro: ${deliveryBairro.value}\nRua: ${deliveryRua.value}\nNúmero: ${deliveryNum.value}`;
    if(!deliveryBairro.value || !deliveryRua.value || !deliveryNum.value){ alert('Preencha o endereço'); return; }
  }
  const client=prompt('Digite seu nome completo:').trim()||'Cliente';

  let message = `Olá, aqui é ${client}.\n\nPedido:\n`;
  cart.forEach(i=>{ message+=`- ${i.name} x${i.qty} — R$ ${(i.price*i.qty).toFixed(2)}\n`; });
  if(deliveryOption==='Delivery'){ message+=`Taxa de Delivery: R$ 5,00\n`; }
  message+=`Total: R$ ${total.toFixed(2)}\n`;
  message+=`Forma de pagamento: ${payment} ${cardType?(`(${cardType})`):''}\n`;
  if(deliveryOption==='Delivery'){ message+=`Endereço para entrega:\n${deliveryAddress}\n`; }

  const whatsappNumber = "5518991616645";
  const url = `https://wa.me/${whatsappNumber}?text=${encodeURIComponent(message)}`;
  window.open(url,'_blank');

  cart=[]; updateCart();
  modal.classList.remove('open');
});

// botão WhatsApp flutuante
document.getElementById('whatsapp-btn').addEventListener('click',()=>{
  const whatsappNumber = "5518991616645";
  window.open(`https://wa.me/${whatsappNumber}`,'_blank');
});
</script>

</body>
</html>
